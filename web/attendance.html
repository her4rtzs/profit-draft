<body class="pf-staff" data-page="attendance" data-title="Attendance" data-welcome="Who is training today">

<div class="dashboard">

    <nav class="sidebar" id="sidebar"></nav>

    <main class="main-content">

        <header class="topbar" id="topbar"></header>

        <section class="stats three">
            <div class="stat-card">
                <div class="stat-top"><div class="stat-icon green"><i class="fa-solid fa-door-open"></i></div></div>
                <div class="stat-content"><p>Checked in today</p><h2 id="statToday">0</h2><small>Members at the gym</small></div>
            </div>
            <div class="stat-card">
                <div class="stat-top"><div class="stat-icon gold"><i class="fa-solid fa-calendar-week"></i></div></div>
                <div class="stat-content"><p>Last 7 days</p><h2 id="statWeek">0</h2><small>Total check-ins</small></div>
            </div>
            <div class="stat-card">
                <div class="stat-top"><div class="stat-icon yellow"><i class="fa-solid fa-fire"></i></div></div>
                <div class="stat-content"><p>Busiest day</p><h2 id="statBest">-</h2><small>This past week</small></div>
            </div>
        </section>

        <section class="panel checkin-panel">
            <div class="checkin-row">
                <div class="rev-title-wrap checkin-copy">
                    <span class="rev-title-ico" aria-hidden="true"><i class="fa-solid fa-user-check"></i></span>
                    <div>
                        <h2>Check in a member</h2>
                        <p>Type a name or member ID, then press Enter.</p>
                    </div>
                </div>
                <div class="checkin-input-wrap">
                    <label class="ci-sr" for="ciInput">Member</label>
                    <i class="fa-solid fa-magnifying-glass checkin-search-ico" aria-hidden="true"></i>
                    <input class="input" id="ciInput" type="text" list="ciList" placeholder="e.g. M202601 or Namjoon" autocomplete="off">
                    <datalist id="ciList"></datalist>
                </div>
                <button class="btn btn-primary checkin-submit" id="ciBtn" type="button"><i class="fa-solid fa-check"></i> Check in</button>
            </div>
        </section>

        <section class="panel revenue-panel attendance-chart-panel">
            <div class="panel-header">
                <div class="rev-title-wrap">
                    <span class="rev-title-ico" aria-hidden="true"><i class="fa-solid fa-chart-column"></i></span>
                    <div>
                        <h2 id="attendanceTitle">Daily attendance</h2>
                        <p id="attendanceSub">Last 14 days</p>
                    </div>
                </div>
                <div class="chip-row" id="attendancePeriods" role="group" aria-label="Attendance period">
                    <button type="button" class="chip active" data-period="days" aria-pressed="true">Days</button>
                    <button type="button" class="chip" data-period="week" aria-pressed="false">Week</button>
                    <button type="button" class="chip" data-period="month" aria-pressed="false">Month</button>
                    <button type="button" class="chip" data-period="year" aria-pressed="false">Year</button>
                </div>
            </div>
            <div class="chart-area">
                <div class="chart-y" id="attendanceAxis">
                    <span>10</span><span>8</span><span>6</span><span>4</span><span>2</span><span>0</span>
                </div>
                <div class="chart">
                    <div class="grid-lines"></div>
                    <div class="bar-container" id="weekBars"></div>
                </div>
            </div>
            <svg class="att-wave" viewBox="0 0 420 56" fill="none" aria-hidden="true" preserveAspectRatio="none">
                <path d="M0 54 C95 52, 165 44, 240 42 C315 40, 365 30, 420 6 L420 56 L0 56 Z" fill="url(#attWaveFill)"/>
                <path d="M0 53 C95 51, 165 43, 240 41 C315 39, 365 29, 420 6" stroke="#ffb020" stroke-width="1.6" stroke-opacity="0.6"/>
                <defs>
                    <linearGradient id="attWaveFill" x1="0" y1="0" x2="420" y2="56" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ffb020" stop-opacity="0.02"/>
                        <stop offset="100%" stop-color="#ffb020" stop-opacity="0.14"/>
                    </linearGradient>
                </defs>
            </svg>
        </section>

        <section class="panel checkins-table-panel">
            <div class="panel-header">
                <div class="rev-title-wrap">
                    <span class="rev-title-ico" aria-hidden="true"><i class="fa-solid fa-clipboard-check"></i></span>
                    <div>
                        <h2>Today's check-ins</h2>
                        <p>Newest first</p>
                    </div>
                </div>
            </div>
            <div class="table-wrapper ci-table-wrap">
                <table class="ci-table">
                    <thead>
                        <tr><th>Time</th><th>Member</th><th>Expires</th><th>Status</th></tr>
                    </thead>
                    <tbody id="ciRows">
                        <tr class="pf-skel" aria-hidden="true"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
                        <tr class="pf-skel" aria-hidden="true"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
                        <tr class="pf-skel" aria-hidden="true"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</div>
