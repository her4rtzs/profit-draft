<body class="pf-staff" data-page="members" data-title="Members" data-welcome="Memberships and enrollment">
<div class="dashboard"><nav class="sidebar" id="sidebar"></nav><main class="main-content"><header class="topbar" id="topbar"></header>

<!-- Hero Page Header -->
<div class="members-header-hero">
  <div class="members-header-icon">
    <i class="fa-solid fa-users"></i>
  </div>
  <div class="members-header-copy">
    <h1>Members</h1>
    <p>Manage and view all your gym members.</p>
  </div>
</div>

<!-- 1. Centered Navigation Tabs (Equal Width & Height) -->
<div class="members-nav-wrap">
  <nav class="members-tabs pp-page-tabs" role="tablist" aria-label="Members sections">
    <button class="members-tab pp-page-tab active" type="button" role="tab" aria-selected="true" data-tab="browse">
      <i class="fa-solid fa-table-cells-large"></i> <span>Browse Members</span>
    </button>
    <button class="members-tab pp-page-tab" type="button" role="tab" aria-selected="false" data-tab="detail">
      <i class="fa-regular fa-id-card"></i> <span>Member Detail</span>
    </button>
    <button class="members-tab pp-page-tab" type="button" role="tab" aria-selected="false" data-tab="enroll">
      <i class="fa-solid fa-plus"></i> <span>New Enrollment</span>
    </button>
    <button class="pp-page-tab" type="button" role="tab" aria-selected="false" data-tab="applications" hidden style="display:none"></button>
  </nav>
</div>

<!-- Section 1: Browse Members -->
<section class="pp-pane active" data-pane="browse">

  <!-- 2. Membership Statistics (4 Summary Cards) -->
  <div class="members-stats-grid">
    <div class="members-stat-card is-total">
      <div class="members-stat-icon is-blue">
        <i class="fa-solid fa-users"></i>
      </div>
      <div class="members-stat-info">
        <span class="members-stat-label">Total Members</span>
        <strong class="members-stat-value" id="statTotal">0</strong>
      </div>
    </div>

    <div class="members-stat-card is-active">
      <div class="members-stat-icon is-green">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <div class="members-stat-info">
        <span class="members-stat-label">Active Members</span>
        <strong class="members-stat-value" id="statActive">0</strong>
      </div>
    </div>

    <div class="members-stat-card is-expiring">
      <div class="members-stat-icon is-amber">
        <i class="fa-solid fa-clock"></i>
      </div>
      <div class="members-stat-info">
        <span class="members-stat-label">Expiring Soon</span>
        <strong class="members-stat-value" id="statExpiring">0</strong>
      </div>
    </div>

    <div class="members-stat-card is-expired">
      <div class="members-stat-icon is-red">
        <i class="fa-solid fa-circle-xmark"></i>
      </div>
      <div class="members-stat-info">
        <span class="members-stat-label">Expired Members</span>
        <strong class="members-stat-value" id="statExpired">0</strong>
      </div>
    </div>
  </div>

  <!-- 3. Search and Toolbar (Single clean bar) -->
  <div class="members-toolbar">
    <div class="members-search-wrap">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input id="memberSearch" type="search" placeholder="Search members by name, ID, email, or phone..." aria-label="Search members">
    </div>

    <div class="members-toolbar-controls">
      <!-- Filter Dropdown -->
      <div class="members-dropdown-wrap" id="filterDropdownWrap">
        <button type="button" class="members-btn-dropdown" id="filterDropdownBtn" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-filter"></i>
          <span id="filterLabel">Filter</span>
          <i class="fa-solid fa-chevron-down caret"></i>
        </button>
        <div class="members-dropdown-menu" id="filterDropdownMenu" hidden>
          <button type="button" class="dropdown-item active" data-filter="all">All</button>
          <button type="button" class="dropdown-item" data-filter="active">Active</button>
          <button type="button" class="dropdown-item" data-filter="expiring">Expiring soon</button>
          <button type="button" class="dropdown-item" data-filter="expired">Expired</button>
        </div>
      </div>

      <!-- Sort By Dropdown -->
      <div class="members-dropdown-wrap" id="sortDropdownWrap">
        <button type="button" class="members-btn-dropdown" id="sortDropdownBtn" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-arrow-down-short-wide"></i>
          <span id="sortLabel">Sort by</span>
          <i class="fa-solid fa-chevron-down caret"></i>
        </button>
        <div class="members-dropdown-menu" id="sortDropdownMenu" hidden>
          <button type="button" class="dropdown-item active" data-sort="name-asc">Name (A–Z)</button>
          <button type="button" class="dropdown-item" data-sort="name-desc">Name (Z–A)</button>
          <button type="button" class="dropdown-item" data-sort="expiry-soon">Expiry Date</button>
          <button type="button" class="dropdown-item" data-sort="plan">Plan</button>
        </div>
      </div>

      <!-- Single View Dropdown (Table / Cards) -->
      <div class="members-dropdown-wrap" id="viewDropdownWrap">
        <button type="button" class="members-btn-dropdown" id="viewDropdownBtn" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-table-cells-large" id="viewIcon"></i>
          <span id="viewLabel">View</span>
          <i class="fa-solid fa-chevron-down caret"></i>
        </button>
        <div class="members-dropdown-menu" id="viewDropdownMenu" hidden>
          <button type="button" class="dropdown-item active" data-view="table">
            <i class="fa-solid fa-table-list"></i> Table
          </button>
          <button type="button" class="dropdown-item" data-view="cards">
            <i class="fa-solid fa-table-cells-large"></i> Cards
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. Members Display (Table & Cards) -->
  <div class="members-table-wrap" id="memberTableWrap">
    <table class="members-table"><tbody>
      <tr class="pf-skel"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
      <tr class="pf-skel"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
      <tr class="pf-skel"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
    </tbody></table>
  </div>
  <div class="members-grid-wrap" id="memberGrid" hidden></div>

  <!-- Pagination footer -->
  <div class="members-footer-row">
    <div class="members-summary" id="memberSummary" aria-live="polite">Showing 1–5 of 124 members</div>
    <nav class="members-pagination" id="memberPager" aria-label="Members pagination"></nav>
  </div>
</section>

<section class="pp-pane" data-pane="applications">
  <div class="pp-segment pp-segment-wide" id="appFilters" role="group" aria-label="Application status">
    <button type="button" class="active" data-app="pending">Pending <span class="pp-count" id="appPendingCount">0</span></button>
    <button type="button" data-app="approved">Approved <span class="pp-count" id="appApprovedCount">0</span></button>
    <button type="button" data-app="declined">Declined <span class="pp-count" id="appDeclinedCount">0</span></button>
  </div>
  <div class="pp-app-list" id="appList"></div>
</section>

<section class="pp-pane" data-pane="detail"><div id="detailRoot"></div></section>

<section class="pp-pane" data-pane="enroll">
  <form class="pp-card pp-enroll" id="enrollForm" novalidate>
    <div class="pp-card-head"><div><h2>Enroll a new member</h2><p>Creates the member record and, if you choose, records the first payment.</p></div></div>
    <div class="pp-form-grid">
      <div class="pp-field"><label for="eName">Full name <span class="req" aria-hidden="true">*</span></label><input id="eName" maxlength="80" autocomplete="off" placeholder="e.g. Juan Dela Cruz"><small class="pp-err" id="eName-err" hidden></small></div>
      <div class="pp-field"><label for="eEmail">Email (used to sign in) <span class="req" aria-hidden="true">*</span></label><input id="eEmail" type="email" maxlength="120" placeholder="name@example.com"><small class="pp-err" id="eEmail-err" hidden></small></div>
      <div class="pp-field"><label for="ePhone">Mobile number</label><input id="ePhone" type="tel" maxlength="20" placeholder="09XX XXX XXXX"><small class="pp-err" id="ePhone-err" hidden></small></div>
      <div class="pp-field"><label for="eStart">Membership start</label><input id="eStart" type="date"><small class="pp-err" id="eStart-err" hidden></small></div>
      <div class="pp-field pp-span-2"><label for="eAddress">Home address</label><input id="eAddress" maxlength="160" placeholder="Street, barangay, city"></div>
    </div>
    <fieldset class="pp-fieldset">
      <legend>Plan <span class="req" aria-hidden="true">*</span></legend>
      <div class="pp-plan-cards" id="ePlans"></div>
      <small class="pp-err" id="ePlan-err" hidden></small>
    </fieldset>
    <div class="pp-form-grid">
      <div class="pp-field"><label for="eMethod">Payment method</label><select id="eMethod"></select></div>
      <div class="pp-field"><label for="eAmount">Amount due</label><input id="eAmount" readonly></div>
    </div>
    <label class="pp-check"><input id="eRecord" type="checkbox" checked> Record the first payment now</label>
    <div class="pp-actions pp-actions-end">
      <button class="pp-btn" type="reset">Clear form</button>
      <button class="pp-btn pp-btn-primary" type="submit"><i class="fa-solid fa-user-plus"></i> Enroll member</button>
    </div>
  </form>
</section>

</main></div>
<script src="layout.js?v=18"></script><script src="sidebar.js?v=17"></script><script src="data.js"></script><script src="pf-common.js"></script><script src="members.js?v=16"></script>
<script src="portal-fx.js?v=2"></script>
<script src="change-password.js?v=2" defer></script>
<script src="notifications-live.js?v=1" defer></script>
<script src="site-footer.js?v=2" defer></script>
</body>
</html>
