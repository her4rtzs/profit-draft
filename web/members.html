<body class="pf-staff" data-page="members" data-title="Members" data-welcome="Memberships and enrollment">
<div class="dashboard"><nav class="sidebar" id="sidebar"></nav><main class="main-content"><header class="topbar" id="topbar"></header>

<div class="pp-members-topbar">
  <div class="pp-browse-title" id="membersHeaderBlock">
    <span class="pp-browse-ico is-amber" id="membersHeaderIco" aria-hidden="true"><i class="fa-solid fa-users"></i></span>

    </button>
    <button class="pp-page-tab" type="button" role="tab" aria-selected="false" data-tab="detail">

      <span class="pp-tab-lbl">Member detail</span>
    </button>
    <button class="pp-page-tab" type="button" role="tab" aria-selected="false" data-tab="enroll">
      <span class="pp-tab-ico is-emerald" aria-hidden="true"><i class="fa-solid fa-user-plus"></i></span>
      <span class="pp-tab-lbl">New enrollment</span>
    </button>
  </nav>
  <svg class="pp-top-wave" viewBox="0 0 420 56" fill="none" aria-hidden="true" preserveAspectRatio="none">

<section class="pp-pane active" data-pane="browse">
  <div class="pp-browse-card">
    <div class="pp-toolbar pp-members-toolbar">
      <label class="pp-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="memberSearch" type="search" placeholder="Search by name, ID, or contact..." aria-label="Search members">
      </label>

      <div class="pp-status-dd" id="memberStatusWrap">
        <button type="button" class="pp-status-btn" id="memberStatusBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="pp-status-btn-inner">
            <span class="pp-dd-ico is-amber" aria-hidden="true"><i class="fa-solid fa-users pp-st-ico is-all" id="memberStatusIco"></i></span>
            <span id="memberStatusLabel">All members</span>
          </span>
          <i class="fa-solid fa-chevron-down pp-dd-caret" aria-hidden="true"></i>
        </button>
        <div class="pp-status-menu" id="memberStatusMenu" role="listbox" hidden>
          <button type="button" class="pp-status-opt is-selected" role="option" aria-selected="true" data-filter="all" data-ico="fa-users" data-cls="is-all" data-label="All members">
            <i class="fa-solid fa-users pp-st-ico is-all" aria-hidden="true"></i><span>All members</span>
          </button>
          <button type="button" class="pp-status-opt" role="option" aria-selected="false" data-filter="active" data-ico="fa-circle-check" data-cls="is-active" data-label="Active">
            <i class="fa-solid fa-circle-check pp-st-ico is-active" aria-hidden="true"></i><span>Active</span>
          </button>
          <button type="button" class="pp-status-opt" role="option" aria-selected="false" data-filter="expired" data-ico="fa-circle-xmark" data-cls="is-expired" data-label="Expired">
            <i class="fa-solid fa-circle-xmark pp-st-ico is-expired" aria-hidden="true"></i><span>Expired</span>
          </button>
          <button type="button" class="pp-status-opt" role="option" aria-selected="false" data-filter="expiring" data-ico="fa-clock" data-cls="is-expiring" data-label="Expiring soon">
            <i class="fa-solid fa-clock pp-st-ico is-expiring" aria-hidden="true"></i><span>Expiring soon</span>
          </button>
          <button type="button" class="pp-status-opt" role="option" aria-selected="false" data-filter="inactive" data-ico="fa-circle-pause" data-cls="is-inactive" data-label="Inactive">
            <i class="fa-solid fa-circle-pause pp-st-ico is-inactive" aria-hidden="true"></i><span>Inactive</span>
          </button>
        </div>
      </div>

      <div class="pp-status-dd" id="memberSortWrap">
        <button type="button" class="pp-status-btn" id="memberSortBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="pp-status-btn-inner">
            <span class="pp-dd-ico is-cyan" aria-hidden="true"><i class="fa-solid fa-arrow-up-a-z pp-st-ico is-cyan" id="memberSortIco"></i></span>
            <span id="memberSortLabel">Sort: A–Z</span>
          </span>
          <i class="fa-solid fa-chevron-down pp-dd-caret" aria-hidden="true"></i>
        </button>
        <div class="pp-status-menu" id="memberSortMenu" role="listbox" hidden>
          <button type="button" class="pp-status-opt is-selected" role="option" aria-selected="true" data-sort="name_asc" data-ico="fa-arrow-up-a-z" data-label="Sort: A–Z">
            <i class="fa-solid fa-arrow-up-a-z pp-st-ico is-cyan" aria-hidden="true"></i><span>Name (A–Z)</span>
          </button>
          <button type="button" class="pp-status-opt" role="option" aria-selected="false" data-sort="name_desc" data-ico="fa-arrow-down-z-a" data-label="Sort: Z–A">
            <i class="fa-solid fa-arrow-down-z-a pp-st-ico is-cyan" aria-hidden="true"></i><span>Name (Z–A)</span>
          </button>
          <button type="button" class="pp-status-opt" role="option" aria-selected="false" data-sort="newest" data-ico="fa-calendar-plus" data-label="Sort: Newest">
            <i class="fa-solid fa-calendar-plus pp-st-ico is-active" aria-hidden="true"></i><span>Newest joined</span>
          </button>
          <button type="button" class="pp-status-opt" role="option" aria-selected="false" data-sort="expiring" data-ico="fa-hourglass-half" data-label="Sort: Expiring">
            <i class="fa-solid fa-hourglass-half pp-st-ico is-expiring" aria-hidden="true"></i><span>Expiring soonest</span>
          </button>
        </div>
      </div>

      <div class="pp-view-toggle" role="group" aria-label="How to show members">
        <button type="button" data-view-mode="table" aria-pressed="true" class="active"><i class="fa-solid fa-table-list" aria-hidden="true"></i> Table</button>
        <button type="button" data-view-mode="cards" aria-pressed="false"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i> Cards</button>
      </div>
    </div>

    <p class="pp-muted pp-summary" id="memberSummary" aria-live="polite"></p>
    <div class="pp-table-wrap pp-members-wrap" id="memberTableWrap">
      <table aria-hidden="true"><tbody>
        <tr class="pf-skel"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
        <tr class="pf-skel"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
        <tr class="pf-skel"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td></tr>
      </tbody></table>
    </div>
    <div class="pp-member-grid" id="memberGrid"></div>
    <nav class="pp-pager" id="memberPager" aria-label="Pages"></nav>
  </div>
</section>

<section class="pp-pane" data-pane="detail"><div id="detailRoot"></div></section>

<section class="pp-pane" data-pane="enroll">
  <form class="pp-card pp-enroll" id="enrollForm" novalidate>
    <div class="pp-card-head pp-enroll-head">
      <span class="pp-browse-ico is-emerald" aria-hidden="true"><i class="fa-solid fa-user-plus"></i></span>
      <div><h2>Enroll a new member</h2><p>Creates the member record and, if you choose, records the first payment.</p></div>
    </div>
    <div class="pp-form-grid">
      <div class="pp-field"><label for="eName">Full name <span class="req" aria-hidden="true">*</span></label><input id="eName" maxlength="80" autocomplete="off" placeholder="e.g. Juan Dela Cruz"><small class="pp-err" id="eName-err" hidden></small></div>
      <div class="pp-field"><label for="eEmail">Email (used to sign in) <span class="req" aria-hidden="true">*</span></label><input id="eEmail" type="email" maxlength="120" placeholder="name@example.com"><small class="pp-err" id="eEmail-err" hidden></small></div>
      <div class="pp-field"><label for="ePhone">Mobile number</label><input id="ePhone" type="tel" maxlength="20" placeholder="09XX XXX XXXX"><small class="pp-err" id="ePhone-err" hidden></small></div>
      <div class="pp-field"><label for="eStart">Membership start</label><input id="eStart" type="date"><small class="pp-err" id="eStart-err" hidden></small></div>
      <div class="pp-field pp-span-2"><label for="eAddress">Home address</label><input id="eAddress" maxlength="160" placeholder="Street, barangay, city"></div>
    </div>
    <fieldset class="pp-fieldset">
      <legend>Plan <span class="req" aria-hidden="true">*</span></legend>
      <div class="pp-plan-cards" id="ePlans"></div>
      <small class="pp-err" id="ePlan-err" hidden></small>
    </fieldset>
    <div class="pp-form-grid">
      <div class="pp-field"><label for="eMethod">Payment method</label><select id="eMethod"></select></div>
      <div class="pp-field"><label for="eAmount">Amount due</label><input id="eAmount" readonly></div>
    </div>
    <label class="pp-check pp-switch-row"><input id="eRecord" type="checkbox" checked><span class="pp-switch-track" aria-hidden="true"></span><span>Record the first payment now</span></label>
    <div class="pp-actions pp-actions-end">
      <button class="pp-btn" type="reset">Clear form</button>
      <button class="pp-btn pp-btn-primary" type="submit"><i class="fa-solid fa-user-plus"></i> Enroll member</button>
    </div>
  </form>
</section>

</main></div>
