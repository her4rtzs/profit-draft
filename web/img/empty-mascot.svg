      <path d="M353 26 L355 19 M361 32 L367 23 L364 31 L374 28 M365 42 L378 39 L371 45 L382 48 M362 52 L372 56 L366 59 L374 66"
            stroke="#18181B" stroke-width="1.8"/>
      <path d="M311 42 L322 48" stroke="#18181B" stroke-width="1.8"/>
    </g>
  </g>

