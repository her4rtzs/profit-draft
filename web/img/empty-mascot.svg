      <ellipse cx="726" cy="86" rx="5.2" ry="3" fill="#F9A8B8" opacity="0.85"/>
      <path d="M696 81 Q700 87 704 81" fill="none" stroke="#18181B" stroke-width="2.7" stroke-linecap="round"/>
