    <!-- Big purple pen with tiny heart accents, gold clip & black grip -->
    <g class="s1-pen">
      <path d="M228 64 C226 57 235 53 239 59 L264 114 L251 120 Z" fill="#554F80" stroke="#18181B" stroke-width="2.6" stroke-linejoin="round"/>
