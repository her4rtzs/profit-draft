      <circle cx="234" cy="66" r="2" fill="#FFF"/>
      <circle cx="239" cy="76" r="2" fill="#FFF"/>
      <circle cx="242" cy="87" r="2" fill="#FFF"/>
      <circle cx="247" cy="95" r="1.8" fill="#FFF"/>
      <!-- Tiny holding paw -->
      <ellipse cx="258" cy="99" rx="6.5" ry="5" fill="#FFE863" stroke="#18181B" stroke-width="2.5"/>
    </g>
    <!-- Animated yellow megaphone & zigzag broadcast waves -->
    <g class="s1-mega">
      <!-- Handle -->
      <path d="M333 65 L339 62 L343 75 L334 78 Z" fill="#FFE45E" stroke="#18181B" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Megaphone body + cone -->
      <path d="M318 55 L344 33 L358 58 L324 67 Z" fill="#FFE45E" stroke="#18181B" stroke-width="2.4" stroke-linejoin="round"/>
      <ellipse cx="351" cy="45.5" rx="7.5" ry="14" transform="rotate(-28 351 45.5)" fill="#F4C430" stroke="#18181B" stroke-width="2.3"/>
      <ellipse cx="351" cy="45.5" rx="3" ry="5" transform="rotate(-28 351 45.5)" fill="#FFE45E" stroke="#18181B" stroke-width="1.8"/>
    </g>
    <g class="s1-wave" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Accent gold sound lines + dark zigzag rays -->
