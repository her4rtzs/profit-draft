<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Animated yellow gym buddy empty-state poses">
  <style>
    /* Slot 0: Barbell Press */
    .s0-buddy { transform-origin: 100px 150px; animation: s0Squat 1.5s ease-in-out infinite; }
    .s0-bar   { transform-origin: 100px 92px;  animation: s0Bar   1.5s ease-in-out infinite; }
    .s0-sw    { animation: pfPulse 1.5s ease-out infinite; }
    @keyframes s0Squat { 0%,100%{transform:translateY(0) scale(1,1)} 35%{transform:translateY(4px) scale(1.03,.96)} 72%{transform:translateY(-4px) scale(.98,1.03)} }
    @keyframes s0Bar   { 0%,100%{transform:translateY(0)} 35%{transform:translateY(5px)} 72%{transform:translateY(-10px)} }

    /* Slot 1: Writing Notebook + Broadcasting Megaphone (Announcements and Notices) */
    .s1-buddy { transform-origin: 278px 136px; animation: s1Nod 2.1s ease-in-out infinite; }
    .s1-pen   { transform-origin: 266px 120px; animation: s1Write .85s ease-in-out infinite alternate; }
    .s1-mega  { transform-origin: 332px 66px;  animation: s1Mega 1.4s ease-in-out infinite; }
    .s1-wave  { transform-origin: 356px 56px;  animation: s1Wave 1.4s ease-out infinite; }
    .s1-star  { transform-origin: center; transform-box: fill-box; animation: pfTwinkle 1.6s ease-in-out infinite alternate; }
    @keyframes s1Nod   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes s1Write { from{transform:rotate(-4deg) translate(0,0)} to{transform:rotate(5deg) translate(3px,2px)} }
    @keyframes s1Mega  { 0%,100%{transform:rotate(-2deg) scale(1)} 45%{transform:rotate(6deg) scale(1.06)} }
    @keyframes s1Wave  { 0%{opacity:.25;transform:scale(.88)} 50%{opacity:1;transform:scale(1.06)} 100%{opacity:.25;transform:scale(.88)} }

    /* Slot 2: Reading Open Book (Reports, Charts, Schedule) */
    .s2-buddy { transform-origin: 500px 115px; animation: s2Peek 2.4s ease-in-out infinite; }
    .s2-heart { animation: pfFloat 2.1s ease-in-out infinite alternate; }
    @keyframes s2Peek  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

    /* Slot 3: Jump Rope (Members, Athletes, Goals) */
    .s3-buddy { transform-origin: 700px 145px; animation: s3Hop .9s ease-in-out infinite; }
    .s3-rope  { transform-origin: 700px 106px; animation: s3Rope .9s ease-in-out infinite; }
    @keyframes s3Hop  { 0%,100%{transform:translateY(3px) scale(1.03,.96)} 50%{transform:translateY(-11px) scale(.97,1.03)} }
    @keyframes s3Rope { 0%,100%{transform:scaleY(.92)} 50%{transform:scaleY(1.06)} }

    /* Slot 4: Towel Rest (All Caught Up, Review Queue, Cashiers) */
    .s4-buddy { transform-origin: 900px 150px; animation: s4Sway 2.4s ease-in-out infinite; }
    .s4-sw    { animation: pfPulse 2s ease-out infinite; }
    @keyframes s4Sway { 0%,100%{transform:rotate(0deg) translateY(0)} 50%{transform:rotate(2deg) translateY(-3px)} }

    /* Slot 5: Twin Mini-Dumbbells (Default Gym Activity) */
    .s5-l { transform-origin: 1062px 104px; animation: s5CurlL 1.4s ease-in-out infinite; }
    .s5-r { transform-origin: 1138px 104px; animation: s5CurlR 1.4s ease-in-out infinite; }
    .s5-b { transform-origin: 1100px 145px; animation: s1Nod 1.4s ease-in-out infinite; }
    @keyframes s5CurlL { 0%,100%{transform:translateY(2px) rotate(6deg)} 50%{transform:translateY(-7px) rotate(-10deg)} }
    @keyframes s5CurlR { 0%,100%{transform:translateY(-7px) rotate(10deg)} 50%{transform:translateY(2px) rotate(-6deg)} }

    @keyframes pfPulse   { 0%{opacity:.25} 50%{opacity:1} 100%{opacity:.25} }
    @keyframes pfTwinkle { from{opacity:.45;transform:scale(.88)} to{opacity:1;transform:scale(1.12)} }
    @keyframes pfFloat   { from{transform:translateY(0)} to{transform:translateY(-5px)} }
    .sh { opacity:.15; fill:#18181B; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <clipPath id="c0"><rect x="0" y="0" width="200" height="180"/></clipPath>
    <clipPath id="c1"><rect x="200" y="0" width="200" height="180"/></clipPath>
    <clipPath id="c2"><rect x="400" y="0" width="200" height="180"/></clipPath>
    <clipPath id="c3"><rect x="600" y="0" width="200" height="180"/></clipPath>
    <clipPath id="c4"><rect x="800" y="0" width="200" height="180"/></clipPath>
    <clipPath id="c5"><rect x="1000" y="0" width="200" height="180"/></clipPath>
  </defs>

  <!-- SLOT 0 (0..200): BARBELL PRESS BUDDY -->
  <g clip-path="url(#c0)">
    <ellipse class="sh" cx="100" cy="161" rx="32" ry="5.5"/>
    <g class="s0-buddy">
      <g class="s0-sw" fill="#18181B">
        <path d="M51 64 C44 59 41 64 46 68 C49 70 52 67 51 64 Z"/>
        <path d="M149 64 C156 59 159 64 154 68 C151 70 148 67 149 64 Z"/>
      </g>
      <path d="M96 31 C93 22 100 18 102 27 C104 19 111 21 108 31 C129 33 145 50 145 76 C145 92 140 107 136 122 C135 134 132 149 124 152 C117 154 113 147 109 142 C104 143 96 143 91 142 C87 147 83 154 76 152 C68 149 65 134 64 122 C60 107 55 92 55 76 C55 50 71 33 96 31 Z"
            fill="#FFE863" stroke="#18181B" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M56 56 Q100 47 144 56 L145 64 Q100 55 55 64 Z" fill="#18181B"/>
      <path d="M77 74 L84 78 L77 82" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M123 74 L116 78 L123 82" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="73" cy="87" rx="5.5" ry="3.2" fill="#F9A8B8" opacity="0.85"/>
      <ellipse cx="127" cy="87" rx="5.5" ry="3.2" fill="#F9A8B8" opacity="0.85"/>
      <path d="M95 82 Q100 88 105 82" fill="none" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M59 95 C49 95 45 87 50 81 C54 76 61 81 62 87" fill="#FFE863" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
      <path d="M141 95 C151 95 155 87 150 81 C146 76 139 81 138 87" fill="#FFE863" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="s0-bar">
      <rect x="28" y="88" width="144" height="7" rx="3.5" fill="#7C76A6" stroke="#18181B" stroke-width="2.6" transform="rotate(-3 100 92)"/>
      <g transform="translate(0,2) rotate(-3 100 92)">
        <ellipse cx="32" cy="91" rx="9" ry="18" fill="#5D5782" stroke="#18181B" stroke-width="2.8"/>
        <ellipse cx="38" cy="91" rx="11" ry="21" fill="#7D76A8" stroke="#18181B" stroke-width="2.8"/>
        <circle cx="38" cy="91" r="2.6" fill="#E8B93A"/>
      </g>
      <g transform="translate(0,-1) rotate(-3 100 92)">
        <ellipse cx="168" cy="92" rx="9" ry="18" fill="#5D5782" stroke="#18181B" stroke-width="2.8"/>
        <ellipse cx="162" cy="92" rx="11" ry="21" fill="#7D76A8" stroke="#18181B" stroke-width="2.8"/>
        <circle cx="162" cy="92" r="2.6" fill="#E8B93A"/>
      </g>
    </g>
  </g>

  <!-- SLOT 1 (200..400): WRITING NOTEBOOK + MEGAPHONE BUDDY -->
  <g clip-path="url(#c1)">
    <ellipse class="sh" cx="288" cy="161" rx="46" ry="5.5"/>
    <!-- Decorative purple stars -->
    <g class="s1-star" fill="#554F80" stroke="#18181B" stroke-width="1.5">
      <polygon points="222,108 224,114 230,114 225,118 227,124 222,120 217,124 219,118 214,114 220,114"/>
      <polygon points="325,103 327,108 332,108 328,111 330,116 325,113 320,116 322,111 318,108 323,108"/>
    </g>
    <!-- Cute round yellow buddy behind notebook -->
