<head><script>(function(){try{var d=localStorage.getItem('theme')!=='light';var h=document.documentElement;h.style.background=d?'#18191a':'#f0f2f5';h.style.colorScheme=d?'dark':'light';}catch(e){}})();</script><script src="splash.js?v=2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFit | Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
<link rel="stylesheet" href="pro-theme.css"><link rel="stylesheet" href="spotify.css?v=14"><link rel="stylesheet" href="portal-ui.css?v=6"><link rel="stylesheet" href="ui-final.css?v=1"><script>try{var pa=localStorage.getItem('pp-accent');document.documentElement.dataset.accent=['gold','spotify','ocean','indigo','coral','emerald','sunset'].indexOf(pa)>-1?pa:'gold'}catch(e){document.documentElement.dataset.accent='gold'}</script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ProFit"><link rel="apple-touch-icon" href="icons/icon-192.png"><script src="pwa.js"></script><link rel="stylesheet" href="sidebar-fx.css?v=1">

<script type="speculationrules">{"prerender":[{"where":{"and":[{"href_matches":"/*.html"},{"not":{"href_matches":"/api/*"}}]},"eagerness":"moderate"}]}</script></head>

<body data-page="reports" data-title="Reports" data-welcome="Your gym at a glance">

<div class="dashboard">

    <nav class="sidebar" id="sidebar"></nav>

    <main class="main-content">

        <header class="topbar" id="topbar"></header>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="transactions" type="button">Transactions</button>
            <button class="tab" data-tab="summary" type="button">Summary</button>
        </div>

        <!-- TRANSACTIONS -->
        <section class="pane active" data-pane="transactions">
            <div class="panel">
                <div class="toolbar">
                    <div class="search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input id="txSearch" type="text" placeholder="Search by member or reference" aria-label="Search transactions">
                    </div>
                    <select class="input input-sm" id="txMethod" aria-label="Filter by payment method"></select>
                    <span class="spacer"></span>
                    <span class="muted" id="txCount"></span>
                    <!-- Both exports share one button style: they are the same
                         kind of action, so dressing them differently implied one
                         was primary and the other a leftover. -->
                    <button class="btn btn-soft" id="exportPdf" type="button"><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
                    <button class="btn btn-soft" id="exportCsv" type="button"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>Date</th><th>Reference</th><th>Member</th><th>Plan</th><th>Method</th><th class="num">Amount</th></tr>
                        </thead>
                        <tbody id="txRows"></tbody>
                        <tfoot>
                            <tr><td colspan="5">Total</td><td class="num"><strong class="plain" id="txTotal">₱0</strong></td></tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </section>

        <!-- SUMMARY -->
        <section class="pane" data-pane="summary">
            <div class="stats three">
                <div class="stat-card">
                    <div class="stat-top"><div class="stat-icon gold"><i class="fa-solid fa-peso-sign"></i></div></div>
                    <div class="stat-content"><p>Total revenue</p><h2 id="sumTotal">₱0</h2><small>All recorded payments</small></div>
                </div>
                <div class="stat-card">
                    <div class="stat-top"><div class="stat-icon green"><i class="fa-solid fa-receipt"></i></div></div>
                    <div class="stat-content"><p>Transactions</p><h2 id="sumCount">0</h2><small>Payments received</small></div>
                </div>
                <div class="stat-card">
                    <div class="stat-top"><div class="stat-icon yellow"><i class="fa-solid fa-scale-balanced"></i></div></div>
                    <div class="stat-content"><p>Average payment</p><h2 id="sumAvg">₱0</h2><small>Per transaction</small></div>
                </div>
            </div>

            <div class="two-col">
                <div class="panel">
                    <div class="panel-header"><div><h2>Revenue by plan</h2><p>Where your income comes from</p></div></div>
                    <div class="break" id="byPlan"></div>
                </div>
                <div class="panel">
                    <div class="panel-header"><div><h2>Revenue by payment method</h2><p>How members pay</p></div></div>
                    <div class="break" id="byMethod"></div>
                </div>
            </div>
        </section>

    </main>

</div>

<script src="layout.js?v=13"></script>
<script src="sidebar.js?v=13"></script>
<script src="data.js"></script>
<script src="pages.js"></script>
<script src="portal-fx.js?v=2"></script>
<script src="change-password.js?v=2" defer></script>
<script src="notifications-live.js?v=1" defer></script>
<script src="site-footer.js?v=2" defer></script>
</body>
</html>
