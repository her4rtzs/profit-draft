<!DOCTYPE html>
<html lang="en">
<head><script src="splash.js?v=1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFit | Payments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
<link rel="stylesheet" href="pro-theme.css"><link rel="stylesheet" href="spotify.css?v=14"><script>try{var pa=localStorage.getItem('pp-accent');document.documentElement.dataset.accent=['gold','spotify','ocean','indigo','coral','emerald','sunset'].indexOf(pa)>-1?pa:'gold'}catch(e){document.documentElement.dataset.accent='gold'}</script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ProFit"><link rel="apple-touch-icon" href="icons/icon-192.png"><script src="pwa.js"></script></head>

<body data-page="payments" data-title="Payments" data-welcome="Record and track payments">

<div class="dashboard">

    <nav class="sidebar" id="sidebar"></nav>

    <main class="main-content">

        <header class="topbar" id="topbar"></header>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="daily" type="button">Daily payment</button>
            <button class="tab" data-tab="subscription" type="button">Subscription monitor</button>
        </div>

        <!-- DAILY PAYMENT -->
        <section class="pane active" data-pane="daily">
            <div class="two-col split">
                <div class="panel">
                    <div class="panel-header">
                        <div>
                            <h2>Record a payment</h2>
                            <p>Paying also extends the member's membership.</p>
                        </div>
                    </div>

                    <form class="form" id="payForm">
                        <div class="field">
                            <label for="payMember">Member</label>
                            <select class="input" id="payMember"></select>
                        </div>
                        <div class="form-row">
                            <div class="field">
                                <label for="payPlan">Plan</label>
                                <select class="input" id="payPlan"></select>
                            </div>
                            <div class="field">
                                <label for="payMethod">Payment method</label>
                                <select class="input" id="payMethod"></select>
                            </div>
                        </div>
                        <div class="field">
                            <label for="payAmount">Amount</label>
                            <input class="input" id="payAmount" type="text" readonly>
                        </div>
                        <button class="btn btn-primary" type="submit">Record payment</button>
                    </form>
                </div>

                <div class="panel">
                    <div class="total-card">
                        <p class="muted">Collected today</p>
                        <h2 id="todayTotal">₱0</h2>
                        <p class="muted" id="todayCount"></p>
                    </div>
                    <ul class="feed" id="todayFeed"></ul>
                </div>
            </div>
        </section>

        <!-- SUBSCRIPTION MONITOR -->
        <section class="pane" data-pane="subscription">
            <div class="panel">
                <div class="toolbar">
                    <!-- Same search control as the reports toolbar, so the two
                         list pages read as one tool set rather than two. -->
                    <div class="search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input id="subSearch" type="text" placeholder="Search by member name or ID" aria-label="Search subscriptions">
                    </div>
                    <div class="chips" id="subChips">
                    <button class="chip active" data-filter="all" type="button">All</button>
                    <button class="chip" data-filter="active" type="button">Active</button>
                    <button class="chip" data-filter="expiring" type="button">Expiring</button>
                    <button class="chip" data-filter="expired" type="button">Expired</button>
                    </div>
                    <span class="spacer"></span>
                    <span class="muted" id="subCount"></span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>Member</th><th>Expires</th><th>Time left</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody id="subRows"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

</div>

<script src="layout.js?v=13"></script>
<script src="sidebar.js?v=13"></script>
<script src="data.js"></script>
<script src="pages.js"></script>
</body>
</html>
