{% load static %}
{% load component_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}ProFit{% endblock %}</title>
    {# Build-time compiled Tailwind + daisyUI only — no runtime CDN. #}
    <link rel="stylesheet" href="{% static 'app.css' %}" />
    {# Vendored HTMX and Alpine (no CDN). Alpine defers per its convention. #}
    <script src="{% static 'htmx.min.js' %}" defer></script>
    <script src="{% static 'alpine.min.js' %}" defer></script>
  </head>
  <body class="min-h-screen bg-base-100 text-base-content">
    <nav class="navbar bg-base-200 px-4" x-data="{ open: false }">
      <div class="flex-1 font-semibold">ProFit</div>
      <div class="flex-none">
        <button class="btn btn-ghost btn-square" @click="open = !open" aria-label="Menu">
          {% component "icon" name="menu" %}{% endcomponent %}
        </button>
        <ul class="menu menu-sm absolute right-4 mt-40 rounded-box bg-base-100 shadow" x-show="open" x-cloak>
          <li><a href="{% url 'membership:member_list' %}">Members</a></li>
        </ul>
      </div>
    </nav>
    <main class="container mx-auto p-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
