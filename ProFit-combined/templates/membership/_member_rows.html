{% for member in members %}
  <tr>
    <td>{{ member.user.username }}</td>
    <td><span class="badge">{{ member.get_membership_status_display }}</span></td>
    <td>{{ member.expiry_date|default:"—" }}</td>
    <td>
      <a href="{% url 'membership:member_detail' member.pk %}" class="link link-primary">View</a>
    </td>
  </tr>
{% empty %}
  <tr>
    <td colspan="4" class="text-center opacity-70">No members found.</td>
  </tr>
{% endfor %}
